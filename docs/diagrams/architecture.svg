<text class="sub" x="600" y="576">topic, email</text>
<rect class="svc" x="296" y="664" width="264" height="84" rx="12"/>
<text class="name" x="312" y="696">Posture</text>
<text class="sub" x="312" y="720">Config, Security Hub</text>
