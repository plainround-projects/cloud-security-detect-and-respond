<text class="name" x="312" y="216">Broad role</text>
<text class="sub" x="312" y="240">drill-broad-role</text>
<text class="sub" x="312" y="262">PowerUserAccess</text>
<rect class="svc" x="584" y="184" width="200" height="112" rx="12"/>
