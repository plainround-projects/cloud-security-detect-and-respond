<path class="store" d="M920 196a108 12 0 0 1 216 0v98a108 12 0 0 1 -216 0z"/>
<path class="rim" d="M920 196a108 12 0 0 0 216 0"/>
<text class="name" x="1028" y="228" text-anchor="middle">Log archive</text>
<text class="sub" x="1028" y="250" text-anchor="middle">Object Lock</text>
<text class="sub" x="1028" y="272" text-anchor="middle">KMS key, no deletes</text>
<rect class="svc" x="904" y="370" width="248" height="112" rx="12"/>
<text class="name" x="920" y="402">detect_respond</text>
<text class="sub" x="920" y="426">scan, timeline, measure,</text>
<text class="sub" x="920" y="448">contain, review</text>
<path class="store" d="M904 552a124 12 0 0 1 248 0v76a124 12 0 0 1 -248 0z"/>
<path class="rim" d="M904 552a124 12 0 0 0 248 0"/>
<text class="name" x="1028" y="584" text-anchor="middle">detections/*.json</text>
<text class="sub" x="1028" y="606" text-anchor="middle">pattern, unchanged</text>
<rect class="actor" x="48" y="526" width="168" height="72" rx="36"/>
<text class="name" x="132" y="558" text-anchor="middle">Responder</text>
<text class="sub" x="132" y="580" text-anchor="middle">the person</text>
